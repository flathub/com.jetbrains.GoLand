app-id: com.jetbrains.GoLand
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: goland-wrapper
separate-locales: false
finish-args:
  - --allow=devel
  - --device=all
  - --env=GOLAND_JDK=${FLATPAK_DEST}/goland/jbr/
  - --env=IDEA_PROPERTIES=${FLATPAK_DEST}/bin/idea.properties
  - --filesystem=host
  - --filesystem=xdg-run/docker
  - --filesystem=xdg-run/gnupg:ro
  - --filesystem=xdg-run/keyring
  - --filesystem=xdg-run/podman
  - --share=ipc
  - --share=network
  - --socket=gpg-agent
  - --socket=pulseaudio
  - --socket=ssh-auth
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.FileManager1
modules:
  - shared-modules/libsecret/libsecret.json
  - modules/rsync.yml
  - name: libyaml
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz
        sha256: c642ae9b75fee120b2d96c712538bd2cf283228d2337df2cf2988e3c02678ef4
        x-checker-data:
          type: json
          url: https://api.github.com/repos/yaml/libyaml/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == ("yaml-" + $version + ".tar.gz")) | .browser_download_url
  - modules/ruby.yml
  - name: wrapper
    buildsystem: meson
    config-opts:
      - -Deditor_binary=/app/bin/goland
      - -Deditor_title=GoLand
      - -Dprogram_name=goland-wrapper
    sources:
      - type: git
        url: https://github.com/flathub-infra/ide-flatpak-wrapper.git
        commit: 3314b55ccd4ece8810715787e246f8407e20caab
  - name: goland
    buildsystem: simple
    build-commands:
      - tar xzfv goland.tar.gz --directory=${FLATPAK_DEST}/ --strip-components=1
      - install -T -Dm644 ${FLATPAK_DEST}/bin/goland.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -t ${FLATPAK_DEST}/share/applications/ -Dm644 ${FLATPAK_ID}.desktop
      - install -t ${FLATPAK_DEST}/share/metainfo/ -Dm644 ${FLATPAK_ID}.metainfo.xml
      - icon_in="${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg";
        icon_out="${FLATPAK_ID}.png"; for s in {32,64,128,256,512}; do rsvg-convert
        "${icon_in}" -w "${s}" -h "${s}" -a -f png -o "${icon_out}"; install -p -Dm644
        "${icon_out}" -t "${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/"; done;
      - cat idea.properties | tee -a ${FLATPAK_DEST}/bin/idea.properties
    sources:
      - type: file
        url: https://download.jetbrains.com/go/goland-2026.3.tar.gz
        sha256: f69816791625bb334b1de9d80ce47a38c0aa90951151846eea899e1a35a15a19
        only-arches: [x86_64]
        x-checker-data:
          type: jetbrains
          code: GO
        dest-filename: goland.tar.gz
      - type: file
        url: https://download.jetbrains.com/go/goland-2026.3-aarch64.tar.gz
        sha256: 60f481ad65b3f2cb03dcfcb13ae0a9719a944597b35d4bf3e84da7502a478ba5
        only-arches: [aarch64]
        x-checker-data:
          type: jetbrains
          code: GO
        dest-filename: goland.tar.gz
      - type: file
        path: com.jetbrains.GoLand.metainfo.xml
      - type: file
        path: com.jetbrains.GoLand.desktop
      - type: file
        path: idea.properties
